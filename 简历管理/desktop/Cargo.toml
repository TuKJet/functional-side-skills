[package]
name = "hr-resume-viewer"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "=0.37.2"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
