[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attendance-audit"
dynamic = ["version"]
description = "Deterministic attendance workbook audit and correction engine for a fixed monthly export layout."
requires-python = ">=3.12,<3.13"
dependencies = [
  "openpyxl>=3.1,<3.2",
]

[project.scripts]
attendance-audit = "attendance_audit.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/attendance_audit"]

[tool.hatch.version]
path = "src/attendance_audit/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
