<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root{--ink:#102033;--muted:#64748b;--line:#d8e3ec;--paper:#fff;--cyan:#00a6c7;--blue:#2563eb;--navy:#07182b;--soft:#edf7fa;--shadow:0 22px 55px rgba(15,40,65,.11)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:linear-gradient(135deg,#edf6fa 0,#f8fbfd 45%,#e9f1f7 100%);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,166,199,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,166,199,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
    .hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 82% 5%,rgba(0,217,255,.23),transparent 26%),linear-gradient(120deg,#061424,#0b2a48 58%,#084d65);padding:54px max(24px,calc((100vw - 1180px)/2)) 44px;border-bottom:1px solid rgba(120,230,255,.28)}
    .hero:after{content:"";position:absolute;width:440px;height:440px;border:1px solid rgba(82,225,255,.18);border-radius:50%;right:-130px;top:-290px;box-shadow:0 0 0 50px rgba(82,225,255,.04),0 0 0 110px rgba(82,225,255,.025)}
    .eyebrow{margin:0 0 8px;color:#70e7ff;font-size:12px;letter-spacing:.24em;font-weight:700}.hero h1{margin:0;max-width:850px;font-size:clamp(30px,5vw,52px);line-height:1.12;letter-spacing:.02em}.hero .subtitle{margin:16px 0 0;color:#c8deeb;font-size:15px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.stat{min-width:150px;padding:12px 16px;border:1px solid rgba(113,224,248,.18);border-radius:12px;background:rgba(8,36,59,.55);backdrop-filter:blur(8px)}.stat b{display:block;color:#fff;font-size:22px}.stat span{color:#91b5c7;font-size:12px}
    .jumpbar{position:sticky;top:0;z-index:8;padding:12px max(20px,calc((100vw - 1180px)/2));background:rgba(247,251,253,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(135,164,184,.35);box-shadow:0 8px 25px rgba(20,55,80,.08)}.jumpbar-head{display:flex;align-items:center;justify-content:space-between;gap:18px}.jump-title{display:flex;align-items:center;gap:10px;min-width:max-content}.jump-title i{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 5px rgba(0,166,199,.12)}.jump-title span{font-size:12px;font-weight:800;letter-spacing:.14em;color:#0d5970}.jump-title small{color:var(--muted)}.jump-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;width:min(650px,62vw)}.search{display:flex;align-items:center;gap:10px;min-width:240px;flex:1;padding:8px 13px;background:#fff;border:1px solid #cedce6;border-radius:10px}.search svg{width:16px;color:var(--cyan)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit}.nav-toggle{display:flex;align-items:center;justify-content:center;gap:8px;min-width:118px;padding:8px 12px;cursor:pointer;color:#0c657c;background:#e9f7fa;border:1px solid #b9dce5;border-radius:10px;font:650 12px/1.5 inherit;transition:.18s ease}.nav-toggle:hover,.nav-toggle[aria-expanded="true"]{color:#fff;background:linear-gradient(120deg,#176bc5,#079cbc);border-color:transparent;box-shadow:0 7px 16px rgba(17,124,176,.2)}.nav-toggle b{display:grid;place-items:center;min-width:22px;height:20px;padding:0 5px;color:#fff;background:#0d93b1;border-radius:10px;font-size:10px}.nav-toggle[aria-expanded="true"] b{color:#176bc5;background:#fff}.nav-toggle:after{content:"⌄";font-size:16px;line-height:1;transition:transform .18s ease}.nav-toggle[aria-expanded="true"]:after{transform:rotate(180deg)}.nav-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:60px;overflow:hidden;margin-top:12px;padding:8px;background:rgba(232,242,247,.8);border:1px solid #d4e3ea;border-radius:12px;scrollbar-width:thin;scrollbar-color:#9fc5d2 transparent;transition:max-height .24s ease}.nav-list.expanded{max-height:350px;overflow-y:auto}.nav-link{display:flex;align-items:center;gap:9px;min-width:0;padding:9px 11px;color:#36566b;text-decoration:none;background:#fff;border:1px solid #d5e2e9;border-radius:9px;transition:.18s ease}.nav-link:hover,.nav-link.active{color:#fff;background:linear-gradient(120deg,#176bc5,#079cbc);border-color:transparent;box-shadow:0 7px 16px rgba(17,124,176,.22)}.nav-link span{font-size:10px;font-weight:800;opacity:.75}.nav-link b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;font-weight:650}
    main{position:relative;width:min(1180px,calc(100% - 36px));margin:34px auto 80px}.process-card{scroll-margin-top:128px;margin:0 0 28px;padding:28px;border:1px solid rgba(157,181,198,.45);border-radius:20px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}.process-head{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}.sequence{display:grid;place-items:center;width:54px;height:54px;flex:none;border-radius:15px;color:#fff;background:linear-gradient(145deg,var(--blue),var(--cyan));font-size:18px;font-weight:800;box-shadow:0 10px 24px rgba(20,139,196,.24)}.process-head p{margin:0;color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.22em}.process-head h2{margin:2px 0 0;font-size:24px;line-height:1.25}.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:20px 0}.meta-item{padding:10px 12px;background:#f5f9fb;border:1px solid #e0eaf0;border-radius:10px}.meta-item span{display:block;color:var(--muted);font-size:11px}.meta-item strong{display:block;margin-top:2px;font-weight:650;overflow-wrap:anywhere}.section-label{display:flex;align-items:center;gap:8px;margin:20px 0 10px;color:#0a718b;font-size:12px;font-weight:800;letter-spacing:.12em}.section-label:before{content:"";width:18px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
    table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:12px}th,td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;overflow-wrap:anywhere}tr:last-child th,tr:last-child td{border-bottom:0}th{width:34%;color:#36536a;background:#f3f8fa;font-weight:650}td{background:#fff}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.image-card{display:block;overflow:hidden;padding:0;cursor:zoom-in;text-align:left;color:inherit;background:#07182b;border:1px solid #d4e1e9;border-radius:14px;box-shadow:0 10px 28px rgba(16,45,65,.12);transition:transform .18s ease,box-shadow .18s ease}.image-card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(16,45,65,.2)}.image-card img{display:block;width:100%;height:174px;object-fit:cover;background:#dce8ed}.image-card span{display:flex;gap:8px;align-items:center;min-height:47px;padding:10px 12px;color:#d7eaf2;font-size:12px;overflow-wrap:anywhere}.image-card span b{color:#52d7ef}.empty{padding:14px;color:var(--muted);background:#f4f8fa;border:1px dashed #c7d7e2;border-radius:10px}.warnings{margin-top:18px;color:#84511c;background:#fff9ed;border:1px solid #f1d6a8;border-radius:10px;padding:9px 13px}.warnings summary{cursor:pointer;font-weight:700}.warnings ul{margin-bottom:4px}
    dialog{width:min(96vw,1200px);max-width:none;padding:0;border:0;border-radius:16px;background:#06111d;box-shadow:0 30px 90px rgba(0,0,0,.5)}dialog::backdrop{background:rgba(3,11,18,.82);backdrop-filter:blur(5px)}.lightbox-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#d8eaf2;border-bottom:1px solid #18354a}.lightbox-head button{width:34px;height:34px;color:#fff;background:#153448;border:0;border-radius:50%;cursor:pointer;font-size:20px}.lightbox img{display:block;max-width:100%;max-height:82vh;margin:auto}.footer{padding:26px;text-align:center;color:#7690a3;font-size:12px}
    .hidden{display:none!important}@media(max-width:650px){.hero{padding-top:38px}.jumpbar{padding:10px 16px}.jumpbar-head{align-items:stretch;flex-direction:column;gap:7px}.jump-title small{display:none}.jump-actions{width:100%;align-items:stretch}.search{width:100%;min-width:0}.nav-toggle{min-width:108px}.nav-list{grid-template-columns:1fr;max-height:58px}.nav-list.expanded{max-height:55vh}.process-card{scroll-margin-top:205px;padding:19px;border-radius:16px}.process-head h2{font-size:20px}.sequence{width:46px;height:46px}.meta-grid{grid-template-columns:1fr 1fr}th{width:42%}.gallery{grid-template-columns:1fr 1fr}.image-card img{height:140px}}@media print{body{background:#fff}.jumpbar,.warnings{display:none}.hero{padding:24px;color:#102033;background:#fff;border-bottom:2px solid #0f9fba}.hero .eyebrow,.hero .subtitle,.stat span{color:#456}.stats{margin-top:14px}.stat{padding:6px 10px;border-color:#ccd;background:#fff}.stat b{color:#123}.process-card{break-inside:avoid;box-shadow:none;margin-bottom:16px}.image-card{box-shadow:none}.image-card span{color:#fff}}
  </style>
</head>
<body>
  <header class="hero"><p class="eyebrow">PROCESS TRACEABILITY / OFFLINE REPORT</p><h1>{{TITLE}}</h1><p class="subtitle">工作表 {{SHEET}} · 生成于 {{GENERATED_AT}}</p><div class="stats"><div class="stat"><b>{{PROCESS_COUNT}}</b><span>工艺段</span></div><div class="stat"><b>{{IMAGE_COUNT}}</b><span>代表图片</span></div><div class="stat"><b>OFFLINE</b><span>单文件 · 无外部依赖</span></div></div></header>
  <section class="jumpbar" aria-label="工艺导航"><div class="jumpbar-head"><div class="jump-title"><i></i><span>工艺导航</span><small>按“工步描述”快速定位</small></div><div class="jump-actions"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="搜索工步、批次、设备或参数…"></label><button class="nav-toggle" id="nav-toggle" type="button" aria-controls="process-nav" aria-expanded="false"><span id="nav-toggle-label">展开导航</span><b>{{PROCESS_COUNT}}</b></button></div></div><nav class="nav-list" id="process-nav">{{NAVIGATION}}</nav></section>
  <main id="report">{{SECTIONS}}</main>
  <footer class="footer">本报告由确定性脚本生成 · 图片已重新编码并内嵌</footer>
  <dialog id="lightbox"><div class="lightbox-head"><span id="lightbox-caption"></span><button id="lightbox-close" type="button" aria-label="关闭">×</button></div><div class="lightbox"><img id="lightbox-image" alt="放大图片"></div></dialog>
  <script>
    (()=>{const q=document.querySelector('#search'),cards=[...document.querySelectorAll('.process-card')],nav=document.querySelector('#process-nav'),toggle=document.querySelector('#nav-toggle'),toggleLabel=document.querySelector('#nav-toggle-label'),links=[...document.querySelectorAll('.nav-link')],dialog=document.querySelector('#lightbox'),image=document.querySelector('#lightbox-image'),caption=document.querySelector('#lightbox-caption');const setNavigation=expanded=>{nav.classList.toggle('expanded',expanded);toggle.setAttribute('aria-expanded',String(expanded));toggleLabel.textContent=expanded?'收起导航':'展开导航'};const activate=id=>links.forEach(link=>{const active=link.dataset.process===id;link.classList.toggle('active',active);active?link.setAttribute('aria-current','true'):link.removeAttribute('aria-current')});toggle.addEventListener('click',()=>setNavigation(toggle.getAttribute('aria-expanded')!=='true'));q.addEventListener('input',()=>{const value=q.value.trim().toLocaleLowerCase();cards.forEach(card=>{const hidden=Boolean(value&&!card.dataset.search.includes(value));card.classList.toggle('hidden',hidden);const link=document.querySelector(`.nav-link[data-process="${card.id}"]`);if(link)link.classList.toggle('hidden',hidden)})});const observer=new IntersectionObserver(entries=>{const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(visible[0])activate(visible[0].target.id)},{rootMargin:'-155px 0px -65% 0px',threshold:[0,.1]});cards.forEach(card=>observer.observe(card));links.forEach(link=>link.addEventListener('click',event=>{event.preventDefault();const target=document.getElementById(link.dataset.process);activate(link.dataset.process);setNavigation(false);history.replaceState(null,'',link.hash);requestAnimationFrame(()=>target?.scrollIntoView({behavior:'smooth',block:'start'}))}));document.querySelectorAll('.image-card').forEach(card=>card.addEventListener('click',()=>{image.src=card.dataset.full;caption.textContent=card.dataset.caption;dialog.showModal()}));document.querySelector('#lightbox-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&dialog.open)dialog.close()})})();
  </script>
</body>
</html>
